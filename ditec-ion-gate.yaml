# ESPHome package: BLE pairing, GATT server and entities for the Ditec ION4B / ION6B.
# Not a standalone config - include it from esphome.yaml via `packages:` (see README.md).
# Expects the substitutions ditec_gate_mac and ditec_gate_pin, and the `ditec_ion` external
# component, to be provided by the including file.

# ---------------------------------------------------------------------------------------------
# Bluetooth: LE Secure Connections + MITM + bonding, passkey entry (matches the original
# NimBLE setup: KeyboardDisplay, AuthReq 0x0D).
# ---------------------------------------------------------------------------------------------
esp32_ble:
  io_capability: keyboard_display
  auth_req_mode: sc_mitm_bond

esp32_ble_tracker:

ble_client:
  - id: gate_client
    mac_address: ${ditec_gate_mac}
    # The ditec_ion component connects (and reconnects, with back-off) itself, so that a gate that
    # is out of range or refuses pairing is not flooded with connection attempts. Keep this false.
    auto_connect: false
    on_connect:
      - logger.log: "Gate: connected (service discovery complete)"
    on_disconnect:
      - logger.log: "Gate: disconnected"
    on_passkey_request:
      - logger.log: "Gate: passkey requested, answering with the PIN"
      - ble_client.passkey_reply:
          id: gate_client
          passkey: ${ditec_gate_pin}
    on_passkey_notification:
      - logger.log:
          format: "Gate: passkey notification %06u"
          args: ["(unsigned) passkey"]

# The gate pushes its status frames by WRITING to this characteristic on the ESP32's own GATT
# server (the original project never subscribes to notifications on the gate). Every frame is
# handed to the component, which parses it.
esp32_ble_server:
  id: ble_server
  services:
    - uuid: "01FF0100-BA5E-F4EE-5CA1-EB1E5E4B1CE0"
      advertise: false
      characteristics:
        - uuid: "01FF0101-BA5E-F4EE-5CA1-EB1E5E4B1CE0"
          read: true
          write: true
          write_no_response: true
          # Hardening: only accept writes over the encrypted, bonded link so a stranger's phone
          # cannot inject fake "gate closed" frames. Needs an ESPHome release that has this
          # option (2026.11 or newer); older versions reject it as an invalid option.
          # write_encrypt: true
          on_write:
            then:
              - lambda: |-
                  id(gate).handle_frame(x);
esphome:
  name: ditec-gate-client
  on_boot:
    priority: 800
    then:
      - lambda: |-
          #include "esp_system.h"
          
          // Generate random bytes for the custom MAC address
          uint8_t random_mac[6];
          for(int i = 0; i < 6; i++) {
            random_mac[i] = esp_random() & 0xFF;
          }
          // Ensure it is a locally administered, unicast address (set bit 1, clear bit 0)
          random_mac[0] = (random_mac[0] & 0xFC) | 0x02;

          // Use esp_base_mac_addr_set with proper system header included
          esp_err_t err = esp_base_mac_addr_set(random_mac);
          if (err == ESP_OK) {
            ESP_LOGD("custom_mac", "Successfully set random BLE MAC address: %02X:%02X:%02X:%02X:%02X:%02X",
                     random_mac[0], random_mac[1], random_mac[2], 
                     random_mac[3], random_mac[4], random_mac[5]);
          } else {
            ESP_LOGE("custom_mac", "Failed to set random BLE MAC address, error code: %d", err);
          }

# ---------------------------------------------------------------------------------------------
# Entities
# ---------------------------------------------------------------------------------------------
cover:
  - platform: ditec_ion
    id: gate
    name: None
    ble_client_id: gate_client
    # reconnect_min_interval: 5s    # wait before retrying; doubles after each failed attempt ...
    # reconnect_max_interval: 5min  # ... up to this
    # notify: true   # only if the gate's characteristic has Notify (see Bring-up, step 2)
    signal_strength:
      name: "BLE signal"
    signal_strength_percent:
      name: "BLE signal strength"
    signal_quality:
      name: "BLE signal quality"
    operation_counter:
      name: "Operation counter"
    partial_open_position:
      name: "Partial open position"
    auto_close_timer:
      name: "Auto close timer"
    auto_close:
      name: "Auto close"
    board_info:
      name: "Controller board"

button:
  - platform: template
    name: "Light"
    icon: mdi:lightbulb
    on_press:
      - lambda: 'id(gate).command_toggle_light();'
  - platform: template
    name: "Partial open"
    icon: mdi:gate-open
    on_press:
      - lambda: 'id(gate).command_partial_open();'
  # Reboots the ESP32. Do not use it within the first minute after an OTA update (see README).
  - platform: restart
    name: "Restart"
    entity_category: config

  # Clears the stored bond and reconnects (use after changing the PIN in the app).
  - platform: template
    name: "Delete pairing"
    icon: mdi:bluetooth-off
    entity_category: config
    on_press:
      - ble_client.disconnect: gate_client
      - delay: 1s
      - ble_client.remove_bond:
          id: gate_client
      - delay: 1s
      - ble_client.connect: gate_client

switch:
  - platform: ble_client
    ble_client_id: gate_client
    name: "BLE connection"
    entity_category: config

binary_sensor:
  - platform: template
    name: "BLE connected"
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(gate_client).connected();'

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: ble_client
    ble_client_id: gate_client
    name: "Module firmware"
    service_uuid: "180A"
    characteristic_uuid: "2A26"
    entity_category: diagnostic
    update_interval: 300s

# ---------------------------------------------------------------------------------------------
# Bring-up (do these in order; the logs tell you which assumption failed)
#   1. Flash, watch the log. Expect: connect -> "passkey requested" -> pairing OK ->
#      "Gate characteristic found" -> "Status 0x.." lines. Status frames arriving = the reverse
#      GATT path (gate writes to our server) works.
#   2. Connected and encrypted but NO "Status" / "RX" lines and the cover never moves off its
#      initial state: the gate is not writing into the ESP32's GATT server over this connection
#      (an ESP-IDF Bluedroid limitation I could not rule out from the source). Check with
#      nRF Connect whether the gate's characteristic has Notify; if it does, set `notify: true`
#      on the cover and the component feeds notifications into the same parser.
#   3. Pairing fails: check the PIN, press "Delete pairing", and compare the log with the
#      NimBLE project's behaviour (it additionally distributes the LINK key, which ESPHome
#      does not expose).
#   4. After a gate power cycle the position is uncalibrated until one full open + close.
# ---------------------------------------------------------------------------------------------
