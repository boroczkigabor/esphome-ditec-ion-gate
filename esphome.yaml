# Ditec ION4B / ION6B (RCB100 BLE module) -> Home Assistant, as a native ESPHome device.
#
# Example configuration for end users: copy this file into your ESPHome dashboard, fill in
# secrets.yaml, install. All gate logic lives in this repository:
#   - components/ditec_ion/   the `ditec_ion` cover component (loaded via external_components)
#   - ditec-ion-gate.yaml     the BLE pairing / GATT server / entities (loaded via packages)
#
# Original protocol work: trapacska/ditec-ion-gate-home-assistant
#   https://github.com/trapacska/ditec-ion-gate-home-assistant
#
# secrets.yaml needs:
#   wifi_ssid, wifi_password,
#   ditec_gate__api_key   ESPHome API encryption key
#   ditec_gate__mac       "00:60:37:XX:XX:XX"   (Ditec Gate Connect app -> Info)
#   ditec_gate__pin       123456                (the PIN you set in the Ditec Gate Connect app)
#
# One-time prerequisite: press the button on the motor, open Ditec Gate Connect and set a PIN,
# so the gate switches from temporary access to PIN pairing (see README.md).

substitutions:
  name: ditec-gate
  friendly_name: Ditec Gate
  ditec_gate_mac: !secret ditec_gate__mac
  ditec_gate_pin: !secret ditec_gate__pin
  # New random Bluetooth address on every boot (default "false"; read the README before enabling).
  random_ble_address: "false"

# The ditec_ion component. Pin to a tag or commit (@v1.0.0) once you have a working setup.
external_components:
  - source: github://boroczkigabor/esphome-ditec-ion-gate@main
    components: [ditec_ion]
    refresh: 1d
  # Developing the component? Use a local checkout instead (path relative to this YAML file):
  # - source:
  #     type: local
  #     path: components
  #   components: [ditec_ion]

packages:
  remote_package:
    url: https://github.com/boroczkigabor/esphome-ditec-ion-gate/
    ref: main
    refresh: 1d
    files: [
      ditec-ion-gate.yaml
    ]

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # While bringing the link up, uncomment for the full GATT / SMP trace:
  # logs:
  #   esp32_ble_client: VERBOSE
  #   ble_client: VERBOSE
  #   esp32_ble_server: VERBOSE
  #   ditec_ion: VERBOSE

api:
  encryption:
    key: !secret ditec_gate__api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
